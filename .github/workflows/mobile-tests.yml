name: mobile-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Marqueur pytest (smoke, regression)"
        default: smoke

env:
  SUITE: ${{ github.event.inputs.suite || 'smoke' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest tests/unit

  android:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Install Appium + driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          pip install -r requirements.txt
          ./tools/fetch_apps.sh

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # chaque ligne de 'script' tourne dans un shell separe : on passe par un script
          script: ./tools/ci_android.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            reports/
            appium.log

  ios:
    needs: unit
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Install Appium + driver
        run: |
          npm install -g appium
          appium driver install xcuitest
          pip install -r requirements.txt
          ./tools/fetch_apps.sh

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          NAME=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['name'], k) for k,v in d.items() if 'iOS' in k for x in v if x['udid']=='$UDID')[0])")
          VERSION=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(k.split('iOS-')[1].replace('-','.') for k,v in d.items() if 'iOS' in k for x in v if x['udid']=='$UDID'))")
          xcrun simctl boot "$UDID"
          echo "IOS_SIM_NAME=$NAME" >> $GITHUB_ENV
          echo "IOS_SIM_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run tests on simulator
        run: |
          appium --log appium.log &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status >/dev/null && break; sleep 1; done
          DEVICE_PROFILE=ios_simulator pytest -m "$SUITE" --reruns 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-reports
          path: |
            reports/
            appium.log
