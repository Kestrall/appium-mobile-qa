[pytest]
testpaths = tests
pythonpath = .
junit_family = xunit1
addopts = -ra --strict-markers --junitxml=reports/junit.xml --alluredir=reports/allure-results
markers =
    smoke: parcours critiques, a jouer sur chaque build
    regression: non-regression complete
    android_only: test specifique Android
    ios_only: test specifique iOS
    real_device_only: necessite un vrai telephone (camera, biometrie materielle)
    tc(id): identifiant du cas de test (Xray / TestLink), ex. tc("MQA-12")
    expects_crash: le test provoque volontairement un crash (pas d'echec auto)
    known_issue(ref): anomalie connue, le test documente le comportement attendu
log_cli = false
log_level = INFO
